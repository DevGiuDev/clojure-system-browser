name: Source World checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.6.1673
          clj-kondo: 2026.10.26
      - run: clojure -Srepro -M:test
      - run: clj-kondo --lint src apps test test-desktop test-tui test-support deps.edn
      - run: clojure -Srepro -M:tui:tui-test
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.6.1673
      - run: clojure -Srepro -M:desktop:desktop-test
