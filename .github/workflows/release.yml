name: Release

# Build-only release packaging (ADR 012): it publishes the TUI/CLI uberjar and
# the csb launcher. It does not run tests and makes no verification claims;
# checks remain local, per the CI decision recorded in docs/roadmap.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  uberjar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.2.1565
      - name: Check that the tag matches the version
        run: |
          version="$(clojure -T:build version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version v$version" >&2
            exit 1
          fi
      - name: Build the TUI/CLI uberjar
        run: clojure -T:build uber
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(clojure -T:build version)"
          gh release create "$GITHUB_REF_NAME" \
            --title "clojure-system-browser $version" \
            --generate-notes \
            "target/clojure-system-browser-$version.jar" \
            "csb"
